name: Fast PR Confidence Pipeline

on:
  pull_request:
    branches: [ master, main ]

jobs:
  schema-and-unit-tests:
    name: Schema & Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Verify Ruleset Cryptographic Hashes
        run: ./scripts/sha256sums.sh verify

      - name: Run Dynamic Schema & Unit Tests
        run: npm run test:schema && npm run test:units

  integration-and-security:
    name: Integration & Security Matrix (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Run Integration & Security Isolation Suites
        run: npm run test:integration && npm run test:security

  deterministic-benchmarks:
    name: Deterministic Benchmark Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Run Deterministic Engine Benchmark
        run: node scripts/benchmark.js
