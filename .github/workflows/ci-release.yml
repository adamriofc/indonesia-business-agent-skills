name: Full Release Engineering & Verification Pipeline

on:
  push:
    branches: [ master, main ]
    # NOTE: deliberately NOT triggering on tags ('v*').
    # GitHub Actions evaluates the workflow file from the pushed commit.
    # A tag points to a feature commit whose release-manifest.json cannot
    # reference its own commit hash (self-referential hash is impossible),
    # so a strict provenance gate would always fail on tag pushes.
    # Release integrity is fully verified on every branch push, where the
    # manifest is locked to the (already-tagged) feature commit; tags are
    # immutable pointers to commits that have already passed this gate.

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  full-test-matrix:
    name: Full Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      - name: Verify Ruleset Cryptographic Hashes
        run: ./scripts/sha256sums.sh verify

      - name: Run Full Test Suite
        run: npm test

  security-and-vulnerability-analysis:
    name: Security & Vulnerability Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Dedicated Security Test Suite
        run: npm run test:security

      - name: Run npm Audit Security Scan
        run: npm audit --audit-level=high

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  package-smoke-test:
    name: Package Smoke Installation Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run Package Smoke Test
        run: npm run test:smoke

  release-gate-and-artifact-retention:
    name: Release Gate & Benchmark Artifact Retention
    runs-on: ubuntu-latest
    needs: [full-test-matrix, security-and-vulnerability-analysis, package-smoke-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Execute Deterministic Benchmark Harness
        run: node scripts/benchmark.js --json-report docs/benchmark-results/latest.json

      - name: Run Performance Regression Gate
        run: npm run test:perf

      - name: Run Documentation SSOT Validator
        run: npm run validate:docs

      - name: Execute 18-Check Release Gate
        run: REQUIRE_RELEASE_TAG=true npm run validate:release

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-latest.json
          path: docs/benchmark-results/latest.json
          retention-days: 90
